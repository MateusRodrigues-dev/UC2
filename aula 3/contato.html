<head>

</head>

<body>
    <header>
        <img width="300" height="200"
             src="https://static.wikia.nocookie.net/logopedia/images/7/7b/Darkest_Dungeon.png/revision/latest?cb=20160323193138"
             alt="Logotipo">
        <h2>Desça até a Masmorra Mais Sombria.</h2>
    </header>
    
   

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Edições.html">Edições</a></li>
            <li><a href="contato.html">Lista de espera</a></li>
        </ul>
    </nav>

    <main>
                <section id="lista-de-espera">
            <h2>Entre na lista de espera</h2>
            <p>Seja avisado assim que o Darkest Dungeon for lançado - sem spam, só o essencial.</p>

            <form action="#" method="post" class="form-lista-espera">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text"
                           id="nome"
                           name="nome"
                           placeholder="Como podemos te chamar?"
                           required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="seuemail@exemplo.com"
                           required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone (opcional)</label>
                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           placeholder="(21) 90000-0000"
                           pattern="\(?\d{2}\)?\s?\d{5,4}\-?\d{4}">
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number"
                           id="idade"
                           name="idade"
                           min="18"
                           placeholder="Sua idade">
                </div>

                <button type="submit">Entrar na lista de espera</button>
                <!-- Corrigido de <buttom> para <button> -->
                <button type="reset">Limpar Formulário</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Darkest Dungeon - Todos os direitos reservados</p>
    </footer>
</body>

</html>
